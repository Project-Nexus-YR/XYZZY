name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor declared in pyproject, not the version development happens
          # on: a gate that only runs the newer interpreter cannot fail on syntax
          # the floor does not have.
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pip install -c constraints.txt -e ".[e2e]" && python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python scripts/check_anchors.py
      - run: pip install pip-audit && pip-audit -r constraints.txt
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: xyzzy:ci
      # Proves the built image actually serves the app, not just that it
      # builds: a broken Dockerfile or entrypoint must fail this job before
      # anything can merge.
      - run: |
          docker run -d --name xyzzy-smoke -p 8000:8000 -e XYZZY_DEMO=1 xyzzy:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs xyzzy-smoke
          exit 1
