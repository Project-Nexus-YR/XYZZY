name: gates

on:
  push:
    branches: [main]
  pull_request:

# A push while an earlier run on the same ref is still going supersedes it:
# only the newest commit's result matters, so cancel the stale one instead of
# letting it finish and burn runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The floor declared in pyproject, not the version development happens
          # on: a gate that only runs the newer interpreter cannot fail on syntax
          # the floor does not have.
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pip install -c constraints.txt -e ".[e2e]" && python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python scripts/check_anchors.py
      # pipx runs pip-audit in its own isolated environment, so the audit
      # never adds a package to the gate interpreter pytest then runs in.
      - run: pipx run pip-audit -r constraints.txt
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: xyzzy:ci
      # Fails the merge on a CRITICAL or HIGH CVE in the base image or the
      # installed packages, the one layer no other gate looks inside.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: xyzzy:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      # Proves the built image actually serves the app, not just that it
      # builds: a broken Dockerfile or entrypoint must fail this job before
      # anything can merge.
      - run: |
          docker run -d --name xyzzy-smoke -p 8000:8000 -e XYZZY_DEMO=1 xyzzy:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs xyzzy-smoke
          exit 1
