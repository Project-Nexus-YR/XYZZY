name: gates

on:
  push:
    branches: [main]
  pull_request:

# A push while an earlier run on the same ref is still going supersedes it:
# only the newest commit's result matters, so cancel the stale one instead of
# letting it finish and burn runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject and the interpreter the image runs:
        # a gate on the newer one alone cannot fail on syntax the floor does
        # not have, and a gate on the floor alone never runs what ships.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pip install -c constraints.txt -e ".[e2e]" && python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python scripts/check_anchors.py
      # pipx runs pip-audit in its own isolated environment, so the audit
      # never adds a package to the gate interpreter pytest then runs in.
      - run: pipx run pip-audit -r constraints.txt
      - run: pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: xyzzy:ci
      # Fails the merge on a CRITICAL or HIGH CVE in the base image or the
      # installed packages, the one layer no other gate looks inside. Only
      # CVEs with a fix are counted: Debian ships slim with several HIGH
      # findings it has no patch for, and a gate nobody can act on is noise.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xyzzy:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # Proves the built image actually serves the app, not just that it
      # builds: a broken Dockerfile or entrypoint must fail this job before
      # anything can merge.
      - run: |
          docker run -d --name xyzzy-smoke -p 8000:8000 -e XYZZY_DEMO=1 xyzzy:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs xyzzy-smoke
          exit 1
