name: live-provider

# The main gates verify provider behavior against a fake transport, which
# keeps every push free and deterministic. This workflow is the opt-in other
# half: triggered by hand, it spends one real API call to prove the genuine
# provider path produces model-written output. It needs the OPENAI_API_KEY
# repository secret; without it the test skips and the run says so.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: pytest tests/integration/test_live_provider.py -v
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
