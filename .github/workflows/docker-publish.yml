name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

# The quickstart everywhere - README, landing page - promises
# `docker run ... ghcr.io/project-nexus-yr/xyzzy`. This workflow is what makes
# that one-liner true: every push to main refreshes :latest, every version tag
# adds its own immutable tag beside it.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/project-nexus-yr/xyzzy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
