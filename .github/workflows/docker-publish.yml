name: image

on:
  # Gated on the gates workflow finishing green on main, so a test-red commit
  # never refreshes :latest. Tags still publish directly: a release tag is a
  # deliberate human action, not a push to main.
  workflow_run:
    workflows: ["gates"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

# Never cancel a publish in progress for an older commit: :latest must land
# in the order runs finish queuing, not race a newer push's cancellation
# against an in-flight registry push.
concurrency:
  group: image-latest
  cancel-in-progress: false

# The quickstart everywhere - README, landing page - promises
# `docker run ... ghcr.io/project-nexus-yr/xyzzy`. This workflow is what makes
# that one-liner true: every green push to main refreshes :latest, every
# version tag adds its own immutable tag beside it.
jobs:
  publish:
    # A workflow_run fires for any gates run on a branch called main, including
    # a fork's pull request from a branch of that name, and it runs with this
    # repository's write token. Publish only when the gates ran for a push to
    # this repository's own main; a tag push is a maintainer's deliberate act.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For actions/attest-build-provenance: id-token mints the Sigstore
      # certificate, attestations persists the resulting attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On the workflow_run trigger, github.sha is this workflow's own
          # definition commit on the default branch, not the commit gates
          # just passed on. Building that instead would silently publish
          # whatever main has moved to since, bypassing the gate this
          # trigger exists to enforce. The push (tag) trigger has no
          # workflow_run event, so it falls back to the normal checkout ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # A tag push is the one path with no gates job upstream: a mistagged
      # commit would otherwise publish a version the code does not match.
      - if: github.event_name == 'push'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$version" = "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/project-nexus-yr/xyzzy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # A signed, verifiable statement that this repository's workflow built
      # this digest, in place of BuildKit's own unsigned provenance metadata:
      # anyone with packages: write could otherwise write metadata just as
      # official-looking. Verify with:
      #   gh attestation verify oci://ghcr.io/project-nexus-yr/xyzzy:latest --owner project-nexus-yr
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/project-nexus-yr/xyzzy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
