[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xyzzy"
version = "0.2.0"
description = "Persistent shared workspace where multiple humans and AI agents work together"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "starlette>=0.36",
    # Verifying a provider's ID token signature is a production path, not a test
    # convenience: PyJWT does the JOSE work and cryptography does the arithmetic
    # behind RS256. Both are named here rather than left to PyJWT's `crypto`
    # extra, because an extra that stops being installed fails at signature
    # verification, which is the one place this deployment must not fail open.
    "pyjwt>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]
nexus = []

[project.scripts]
xyzzy = "multiplayer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multiplayer = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
