[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xyzzy"
version = "0.4.0"
description = "Persistent shared workspace where multiple humans and AI agents work together"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    # websockets is not named here: uvicorn[standard] already requires it
    # (see importlib.metadata.requires('uvicorn')), and its own floor is the
    # one that actually constrains the realtime transport.
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "starlette>=0.36",
    # Verifying a provider's ID token signature is a production path, not a test
    # convenience: PyJWT does the JOSE work and cryptography does the arithmetic
    # behind RS256. Both are named here rather than left to PyJWT's `crypto`
    # extra, because an extra that stops being installed fails at signature
    # verification, which is the one place this deployment must not fail open.
    "pyjwt>=2.8",
    "cryptography>=42",
    # FastAPI's own multipart form parsing (UploadFile), for the attachment upload route.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "fakeredis>=2.20",
]
# Cross-process fan-out for the realtime hub (XYZZY_REDIS_URL). The single
# process default needs none of this; see src/multiplayer/realtime/fanout.py.
redis = ["redis>=5.0"]
# Browser-driven end-to-end tests. Not part of dev: it pulls a Chromium
# binary, so it is installed only by the CI step that runs those tests.
e2e = ["playwright>=1.45"]
# Screenshot reproduction for scripts/capture_hero.py and
# scripts/capture_scenes.py: `pip install -e ".[capture]"`.
capture = ["playwright>=1.45", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multiplayer = ["migrations/*.sql", "web/*", "web/js/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
