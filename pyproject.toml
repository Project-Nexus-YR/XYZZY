[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiplayer-ai"
version = "0.1.0"
description = "Persistent shared workspace where multiple humans and AI agents work together"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    # Only the SIGNED_CHALLENGE proof mode needs Ed25519, and no production path
    # builds one of those yet. Without it that mode refuses to launch, which is the
    # direction a missing verifier should fail in.
    "cryptography>=42",
]
nexus = []

[project.scripts]
multiplayer = "multiplayer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multiplayer = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
